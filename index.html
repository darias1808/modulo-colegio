<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Ética Profesional · Plataforma</title>
    <meta name="description" content="Plataforma de aprendizaje del Curso de Ética Profesional del Colegio de Ciencias Económicas de Costa Rica." />
    <meta name="theme-color" content="#1b376c" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Montserrat:wght@500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/plataforma.css" />
    <script>
      // Tema elegido por la persona (si no eligió, sigue al sistema). Va aquí para que no parpadee al cargar.
      try { var tema = localStorage.getItem("plataforma-etica-tema"); if (tema) document.documentElement.setAttribute("data-theme", tema); } catch (e) {}
    </script>
  </head>
  <body>
    <a class="saltar" href="#escenario">Saltar al contenido</a>

    <header class="barra">
      <button id="btn-ruta" class="btn-barra" type="button" aria-label="Ruta del curso" aria-expanded="false" aria-controls="ruta">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18v2H3zm0 5h18v2H3zm0 5h18v2H3z" /></svg>
        <span>Ruta del curso</span>
      </button>
      <div class="barra-centro">
        <span class="marca"><span class="largo">Ética Profesional</span><span class="corto">Ética</span></span>
        <span id="donde" class="donde" aria-live="polite"></span>
      </div>
      <div class="barra-der">
        <div id="avance" class="avance" role="img" aria-label="Avance del curso">
          <svg viewBox="0 0 36 36" aria-hidden="true"><circle class="avance-fondo" cx="18" cy="18" r="15" /><circle id="avance-arco" class="avance-arco" cx="18" cy="18" r="15" /></svg>
          <span id="avance-txt">0 %</span>
        </div>
        <button id="btn-practica" class="btn-barra" type="button" aria-label="Práctica" aria-expanded="false" aria-controls="practica">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 16.2 4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4z" /></svg>
          <span>Práctica</span>
        </button>
        <button id="btn-tema" class="btn-barra" type="button" aria-label="Modo oscuro" aria-pressed="false">
          <svg class="luna" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9z" /></svg>
          <svg class="sol" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 7a5 5 0 1 0 0 10 5 5 0 0 0 0-10zM11 1h2v3h-2zm0 19h2v3h-2zM1 11h3v2H1zm19 0h3v2h-3zM4.2 5.6l1.4-1.4 2.1 2.1-1.4 1.4zm12.1 12.1 1.4-1.4 2.1 2.1-1.4 1.4zM4.2 18.4l2.1-2.1 1.4 1.4-2.1 2.1zM16.3 6.3l2.1-2.1 1.4 1.4-2.1 2.1z" /></svg>
          <span>Modo oscuro</span>
        </button>
        <button id="btn-foco" class="btn-barra" type="button" aria-label="Solo el video" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 14H5v5h5v-2H7zm-2-4h2V7h3V5H5zm12 7h-3v2h5v-5h-2zM14 5v2h3v3h2V5z" /></svg>
          <span>Solo el video</span>
        </button>
      </div>
    </header>

    <div class="cuerpo">
      <aside id="ruta" class="panel-lado ruta" aria-label="Ruta del curso" hidden>
        <div class="panel-cab">
          <h2>Ruta del curso</h2>
          <button id="cerrar-ruta" class="btn-ico" type="button" aria-label="Cerrar la ruta">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15.4 7.4 14 6l-6 6 6 6 1.4-1.4L10.8 12z" /></svg>
          </button>
        </div>
        <nav id="ruta-lista" class="ruta-lista"></nav>
      </aside>

      <main id="escenario" class="escenario" tabindex="-1"></main>

      <aside id="practica" class="panel-lado practica" aria-label="Práctica del módulo" hidden>
        <div class="panel-cab">
          <h2>Práctica</h2>
          <button id="cerrar-practica" class="btn-ico" type="button" aria-label="Cerrar la práctica">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8.6 16.6 10 18l6-6-6-6-1.4 1.4 4.6 4.6z" /></svg>
          </button>
        </div>
        <div id="practica-cuerpo" class="practica-cuerpo"></div>
      </aside>
    </div>

    <section id="nano" class="nano" aria-label="Nano, tu asistente">
      <div class="nano-barra">
        <span class="nano-logo" aria-hidden="true">N</span>
        <div class="nano-tabs" role="tablist" aria-label="Herramientas de Nano">
          <button class="nano-tab" role="tab" data-tab="practicar" id="tab-practicar" aria-controls="nano-panel" aria-selected="false" type="button">Practicar</button>
          <button class="nano-tab" role="tab" data-tab="consultar" id="tab-consultar" aria-controls="nano-panel" aria-selected="false" type="button">Consultar</button>
          <button class="nano-tab" role="tab" data-tab="apuntes" id="tab-apuntes" aria-controls="nano-panel" aria-selected="false" type="button">Apuntes</button>
          <button class="nano-tab" role="tab" data-tab="texto" id="tab-texto" aria-label="Transcripción" aria-controls="nano-panel" aria-selected="false" type="button"><span class="largo">Transcripción</span><span class="corto">Texto</span></button>
        </div>
        <button id="nano-toggle" class="btn-ico" type="button" aria-expanded="false" aria-controls="nano-panel" aria-label="Abrir Nano">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path id="nano-ico" d="M7.4 15.4 12 10.8l4.6 4.6L18 14l-6-6-6 6z" /></svg>
        </button>
      </div>
      <div id="nano-panel" class="nano-panel" role="tabpanel" hidden></div>
    </section>

    <div id="vivo" class="solo-lector" aria-live="polite"></div>
    <noscript><p class="sin-js">Esta plataforma necesita JavaScript activado.</p></noscript>

    <script src="js/datos.js"></script>
    <script src="js/casos.js"></script>
    <script src="js/ejercicios.js"></script>
    <script src="js/plataforma.js"></script>
  </body>
</html>
